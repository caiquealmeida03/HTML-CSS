<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Midia HTML</title>

<body>

    <p>Tente abrir esse site em diferentes dispositivos</p>

        <source media="(max-width: 1025px)" srcset="imagens/foto-m.png" type="image/png">
        <img src="imagens/foto-g.png" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo Áudio</h1>
    <p>Vamos reproduzir áudios</p>
    <audio src="midia/Matuê - A Morte do Autotune 💔 (Áudio) - 30PRAUM FC (youtube).mp3" controls></audio>

</html>
